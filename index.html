<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">Certificaciones</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <h1 class="logo" data-i18n="siteTitle">🤖 Certificaciones</h1>
    <div class="header-actions">
      <button id="langToggle" class="icon-btn" aria-label="Cambiar idioma">ES / EN</button>
      <button id="themeToggle" class="icon-btn" aria-label="Cambiar tema">🌙</button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <p data-i18n="heroSubtitle">Un registro visual de mis certificaciones.</p>
    <div class="stats" id="stats"></div>
  </section>

  <section class="controls">
    <div class="controls-row">
      <div class="search-wrap">
        <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Buscar certificaciones...">
        <button id="searchClear" type="button" class="search-clear hidden" aria-label="Borrar búsqueda">&times;</button>
        <div id="searchSuggestions" class="search-suggestions hidden"></div>
      </div>
      <button id="sortToggle" class="icon-btn sort-btn" aria-label="Ordenar por fecha">
        <span id="sortIcon">↓</span> <span id="sortLabel" data-i18n="sortNewest">Más recientes</span>
      </button>
      <div class="issuer-filter-wrap">
        <button id="issuerToggle" class="icon-btn sort-btn" aria-label="Filtrar por emisor">
          <span id="issuerLabel" data-i18n="issuerAll">Todos los emisores</span> <span>▾</span>
        </button>
        <div id="issuerDropdown" class="search-suggestions hidden"></div>
      </div>
    </div>
  </section>

  <section class="cards-grid" id="cardsGrid"></section>

  <div class="load-more-wrap">
    <button id="loadMoreBtn" type="button" class="icon-btn load-more-btn hidden" data-i18n="loadMore">Cargar más</button>
  </div>

  <p id="emptyState" class="empty-state hidden" data-i18n="emptyState">No se encontraron certificaciones.</p>
</main>

<footer class="site-footer">
  <p>Información de contacto</p>
  <div class="contact-links">
    <a href="https://github.com/adlopp" target="_blank" rel="noopener noreferrer" class="contact-link">
      <span class="contact-icon">🐙</span> GitHub
    </a>
    <a href="https://linkedin.com/in/adlopp" target="_blank" rel="noopener noreferrer" class="contact-link">
      <span class="contact-icon">💼</span> LinkedIn
    </a>
    <a href="mailto:adlopezpe@gmail.com" class="contact-link">
      <span class="contact-icon">✉️</span> adlopezpe@gmail.com
    </a>
    <a href="tel:+34625890482" class="contact-link">
      <span class="contact-icon">📱</span> +34 625 89 04 82
    </a>
  </div>
</footer>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" role="dialog" aria-modal="true">
    <button id="modalClose" class="modal-close" aria-label="Cerrar">&times;</button>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script src="certifications.js"></script>
<script src="script.js"></script>
</body>
</html>
